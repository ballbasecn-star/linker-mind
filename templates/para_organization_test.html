<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试 - 输入性能</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .test-input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            margin: 10px 0;
        }

        .test-input:focus {
            outline: 2px solid #000;
            outline-offset: -2px;
        }

        .stats {
            margin: 20px 0;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 4px;
        }

        .btn {
            padding: 10px 20px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }

        .btn:hover {
            background: #333;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
        }
    </style>
</head>
<body>
    <h1>输入性能测试</h1>

    <div class="stats">
        <div>输入事件次数: <span id="inputCount">0</span></div>
        <div>最后输入延迟: <span id="lastLatency">0</span> ms</div>
        <div>平均延迟: <span id="avgLatency">0</span> ms</div>
    </div>

    <h2>测试 1: 普通输入框</h2>
    <input type="text" class="test-input" id="test1" placeholder="在这里输入测试...">

    <h2>测试 2: Modal 中的输入框</h2>
    <button class="btn" onclick="openModal()">打开 Modal</button>

    <div class="modal" id="testModal">
        <div class="modal-content">
            <h3>Modal 中的输入框</h3>
            <input type="text" class="test-input" id="test2" placeholder="在 Modal 中输入测试...">
            <br><br>
            <button class="btn" onclick="closeModal()">关闭</button>
        </div>
    </div>

    <script>
        // 统计
        let inputCount = 0;
        let latencies = [];
        let lastInputTime = 0;

        function recordInput() {
            const now = performance.now();
            if (lastInputTime > 0) {
                const latency = now - lastInputTime;
                latencies.push(latency);
                document.getElementById('lastLatency').textContent = latency.toFixed(2);
                document.getElementById('avgLatency').textContent = (latencies.reduce((a,b) => a+b, 0) / latencies.length).toFixed(2);
            }
            lastInputTime = now;
            inputCount++;
            document.getElementById('inputCount').textContent = inputCount;
        }

        // 监听输入
        document.getElementById('test1').addEventListener('input', recordInput);
        document.getElementById('test2').addEventListener('input', recordInput);

        // Modal 控制
        function openModal() {
            document.getElementById('testModal').classList.add('active');
            document.getElementById('test2').focus();
        }

        function closeModal() {
            document.getElementById('testModal').classList.remove('active');
        }

        // 点击外部关闭
        document.getElementById('testModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
