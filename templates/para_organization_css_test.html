<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS测试 - PARA组织</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #fafafa;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f5f5f5;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --border-color: #e5e5e5;
            --accent-color: #000000;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 20px;
        }

        .node-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .node-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .node-card-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .node-card-description {
            font-size: 0.9375rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        /* Modal - Test 1: Original complex CSS */
        .modal-overlay-1 {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay-1.active {
            display: flex;
        }

        .modal-1 {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 32px;
            width: 90%;
            max-width: 500px;
        }

        /* Test inputs */
        .test-input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        .btn {
            padding: 10px 20px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>CSS 性能测试</h1>
    <p>这个页面包含原页面的 DOM 结构和 CSS，但没有 JavaScript 逻辑。</p>

    <button class="btn" onclick="openModal1()">打开 Modal 1 (原CSS)</button>
    <button class="btn" onclick="openModal2()">打开 Modal 2 (简化版)</button>

    <!-- 模拟原页面的节点卡片 -->
    <div class="node-grid">
        <div class="node-card">
            <div class="node-card-title">测试项目 1</div>
            <div class="node-card-description">这是一个测试项目描述</div>
        </div>
        <div class="node-card">
            <div class="node-card-title">测试项目 2</div>
            <div class="node-card-description">这是另一个测试项目描述</div>
        </div>
        <div class="node-card">
            <div class="node-card-title">测试项目 3</div>
            <div class="node-card-description">第三个测试项目描述</div>
        </div>
    </div>

    <!-- Modal 1: 原CSS -->
    <div class="modal-overlay-1" id="modal1">
        <div class="modal-1">
            <h2>测试输入 - Modal 1</h2>
            <input type="text" class="test-input" placeholder="在这里输入测试...">
            <textarea class="test-input" rows="4" placeholder="在这里输入多行文本..."></textarea>
            <button class="btn" onclick="closeModal1()">关闭</button>
        </div>
    </div>

    <!-- Modal 2: 简化版 -->
    <div id="modal2" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:1001;align-items:center;justify-content:center;">
        <div style="background:white;padding:30px;border-radius:8px;width:90%;max-width:500px;">
            <h2>测试输入 - Modal 2</h2>
            <input type="text" class="test-input" placeholder="在这里输入测试...">
            <textarea class="test-input" rows="4" placeholder="在这里输入多行文本..."></textarea>
            <button class="btn" onclick="closeModal2()">关闭</button>
        </div>
    </div>

    <script>
        function openModal1() {
            document.getElementById('modal1').classList.add('active');
        }

        function closeModal1() {
            document.getElementById('modal1').classList.remove('active');
        }

        function openModal2() {
            document.getElementById('modal2').style.display = 'flex';
        }

        function closeModal2() {
            document.getElementById('modal2').style.display = 'none';
        }
    </script>
</body>
</html>
